<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông tin thành viên</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .form {
            width: 500px;
            margin: 30px auto;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
        }

        td {
            padding: 5px;
        }

        .label {
            text-align: right;
            width: 120px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
        }

        .button {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="form">

    <h1>PHIẾU ĐĂNG KÝ</h1>

    <form>
        <table>

            <tr>
                <td class="label">Họ và tên:</td>
                <td>
                    <input type="text" required>
                    (*)
                </td>
            </tr>

            <tr>
                <td class="label">Địa chỉ:</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td class="label">Email:</td>
                <td>
                    <input type="email" required>
                    (*)
                </td>
            </tr>

            <tr>
                <td class="label">Giới tính:</td>
                <td>
                    <input type="radio" name="gioitinh"> Nam
                    <input type="radio" name="gioitinh"> Nữ
                </td>
            </tr>

            <tr>
                <td class="label">Tuổi:</td>
                <td>
                    <input type="number" required>
                    (*)
                </td>
            </tr>

            <tr>
                <td class="label">Sở thích:</td>
                <td>
                    <input type="checkbox"> Thể thao<br>
                    <input type="checkbox"> Văn học<br>
                    <input type="checkbox"> Công nghệ thông tin<br>
                    <input type="checkbox"> Lịch sử<br>
                    <input type="checkbox"> Game
                </td>
            </tr>

            <tr>
                <td class="label">Chuyên ngành:</td>
                <td>
                    <select>
                        <option>Công nghệ Web</option>
                        <option>Công nghệ thông tin</option>
                        <option>Thiết kế Web</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td class="label">Gửi hình:</td>
                <td>
                    <input type="file">
                </td>
            </tr>

            <tr>
<td class="label">Yêu cầu:</td>
                <td>
                    <textarea></textarea>
                </td>
            </tr>

            <tr>
                <td></td>
                <td class="button">
                    <input type="submit" value="Gửi thông tin">
                    <input type="reset" value="Nhập lại">
                </td>
            </tr>

        </table>
    </form>

</div>

</body>
</html>
