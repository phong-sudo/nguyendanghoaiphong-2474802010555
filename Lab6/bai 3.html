<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xếp loại học lực</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }
        input {
            padding: 6px;
            width: 150px;
        }
        button {
            padding: 6px 14px;
            cursor: pointer;
        }
        #ketqua {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #c00;
        }
    </style>
</head>
<body>
    <h2>Xếp loại học lực</h2>

    <label for="diem">Nhập điểm (0-100):</label>
    <input type="number" id="diem" min="0" max="100" placeholder="Ví dụ: 85">
    <button onclick="xepLoai()">Xếp loại</button>

    <p id="ketqua"></p>

    <script>
        function xepLoai() {
            var diem = parseFloat(document.getElementById("diem").value);
            var ketQua = document.getElementById("ketqua");

            if (isNaN(diem)) {
                ketQua.innerHTML = "Vui lòng nhập điểm!";
            } else if (diem < 0 || diem > 100) {
                ketQua.innerHTML = "Điểm phải nằm trong khoảng 0 - 100!";
            } else if (diem >= 90) {
                ketQua.innerHTML = "Xếp loại: A";
            } else if (diem >= 80) {
                ketQua.innerHTML = "Xếp loại: B";
            } else if (diem >= 70) {
                ketQua.innerHTML = "Xếp loại: C";
            } else if (diem >= 60) {
                ketQua.innerHTML = "Xếp loại: D";
            } else {
                ketQua.innerHTML = "Xếp loại: F";
            }
        }
    </script>
</body>
</html>
