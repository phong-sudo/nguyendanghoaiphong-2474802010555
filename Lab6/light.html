<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bóng đèn</title>
</head>
<body>
    <h2>Chương trình bật / tắt bóng đèn</h2>
    <img id="bulb" src="./bulboff.gif" alt="light" width="120px"><br><br>
    <button onclick="toggleLight()">On / Off</button>

    <script>
       function toggleLight() {
           let bulb = document.getElementById("bulb");
           if (bulb.getAttribute("src").includes("bulboff.gif")) {
               bulb.src = "./bulbon.gif";
           } else {
               bulb.src = "./bulboff.gif";
           }
       }
    </script>
</body>
</html>
