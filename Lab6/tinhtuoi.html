<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>CHUONG TRINH TINH TUOI</h2>
    <label for="">Nhap vao nam sinh cua ban</label>
    <input type="number" id="namsinh">
    <br><br>
    <button onclick="tinhtuoi()">Tinh Tuoi</button>
    <p id="ketqua"></p>

    <script>

        function tinhtuoi(){
            let yourBirth = document.getElementById("namsinh").value;
            let currentyear = new Date().getFullYear();
            let yourage = currentyear - yourBirth;
            document.getElementById("ketqua").innerHTML = "Tuổi của bạn là:" + yourage ;
        }
    </script>
</body>
</html>
