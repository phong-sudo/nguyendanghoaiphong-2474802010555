<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài tập: Quản Lý Sinh Viên</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h1>Bài Tập: Quản Lý Sinh Viên</h1>

  <!-- Ô nhập liệu: dùng chung cho cả Thêm và Sửa -->
  <div class="form-nhap">
    <input type="text" id="mssv" placeholder="Mã SV (VD: SV001)">
    <input type="text" id="hoten" placeholder="Họ tên">
    <input type="text" id="lop" placeholder="Lớp (VD: CNTT01)">
    <button id="btnThem" onclick="luuSinhVien()">Thêm</button>
  </div>

  <!-- BẢNG DANH SÁCH -->
  <table>
    <thead>
      <tr>
        <th>Mã SV</th>
        <th>Họ tên</th>
        <th>Lớp</th>
        <th>Thao tác</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- Các dòng sinh viên sẽ được JS điền vào đây -->
    </tbody>
  </table>
</div>

<script>
  /* =========================================================
     BÀI TẬP: hoàn thiện 5 hàm còn thiếu (đánh dấu TODO) để
     ứng dụng Quản Lý Sinh Viên chạy đúng như bản demo trên lớp.
     Làm lần lượt từ TODO 1 -> TODO 5, test lại sau mỗi bước
     (nhớ mở lại trang trên trình duyệt để chạy code mới).
     ========================================================= */

  // Dữ liệu mẫu ban đầu - KHÔNG cần sửa phần này
  let danhSachSV = [
    { mssv: "SV001", hoten: "Nguyễn Văn A", lop: "CNTT01" },
    { mssv: "SV002", hoten: "Trần Thị B",  lop: "CNTT02" },
    { mssv: "SV003", hoten: "Lê Văn C",    lop: "CNTT01" }
  ];

  // Mã SV đang được sửa. null nghĩa là đang ở chế độ Thêm mới - KHÔNG cần sửa
  let dangSuaId = null;

  // Tham chiếu DOM - KHÔNG cần sửa phần này
  const oMssv = document.getElementById("mssv");
  const oHoten = document.getElementById("hoten");
  const oLop = document.getElementById("lop");
  const oBtnThem = document.getElementById("btnThem");
  const oTableBody = document.getElementById("tableBody");
  /* =========================================================
     TODO 1: Hàm timViTri(mssv)
     ========================================================= */
  function timViTri(mssv) {
    for (let i = 0; i < danhSachSV.length; i++) {
      if (danhSachSV[i].mssv === mssv) {
        return i;
      }
    }
    return -1;
  }

  /* =========================================================
     TODO 2: Hàm hienThiDanhSach()
     ========================================================= */
  function hienThiDanhSach() {
    let html = "";
    for (let i = 0; i < danhSachSV.length; i++) {
      let sv = danhSachSV[i];
      html += `
        <tr>
          <td>${sv.mssv}</td>
          <td>${sv.hoten}</td>
          <td>${sv.lop}</td>
          <td>
            <button class="btn-sua" onclick="suaSinhVien('${sv.mssv}')">Sửa</button>
<button class="btn-xoa" onclick="xoaSinhVien('${sv.mssv}')">Xóa</button>
</td>
        </tr>
      `;
    }
    oTableBody.innerHTML = html;
  }

  /* =========================================================
     TODO 3: Hàm luuSinhVien()
     ========================================================= */
  function luuSinhVien() {
    let mssv = oMssv.value.trim();
    let hoten = oHoten.value.trim();
    let lop = oLop.value.trim();

    // Kiểm tra không để trống
if (mssv === "" || hoten === "" || lop === "") {
      alert("Vui lòng điền đầy đủ thông tin!");
      return;
    }

    if (dangSuaId === null) {
      // Chế độ THÊM MỚI
      let svMoi = { mssv: mssv, hoten: hoten, lop: lop };
      danhSachSV.push(svMoi);
    } else {
      // Chế độ CẬP NHẬT
      let viTri = timViTri(dangSuaId);
      if (viTri !== -1) {
        danhSachSV[viTri] = { mssv: mssv, hoten: hoten, lop: lop };
      }
      dangSuaId = null;
      oBtnThem.innerText = "Thêm";
      oMssv.disabled = false; // Mở lại ô nhập mã SV nếu trước đó bị khóa
    }

    // Xóa trắng ô input và cập nhật giao diện
    oMssv.value = "";
    oHoten.value = "";
    oLop.value = "";
    hienThiDanhSach();
  }

  /* =========================================================
     TODO 4: Hàm xoaSinhVien(mssv)
     ========================================================= */
  function xoaSinhVien(mssv) {
    let viTri = timViTri(mssv);
    if (viTri !== -1) {
      danhSachSV.splice(viTri, 1);
      hienThiDanhSach();
    }
  }

  /* =========================================================
     TODO 5: Hàm suaSinhVien(mssv)
     ========================================================= */
  function suaSinhVien(mssv) {
    let viTri = timViTri(mssv);
    if (viTri !== -1) {
      let sv = danhSachSV[viTri];
      oMssv.value = sv.mssv;
      oHoten.value = sv.hoten;
      oLop.value = sv.lop;

      dangSuaId = mssv;
      oBtnThem.innerText = "Cập nhật";
    }
  }

  // Hiển thị danh sách mẫu ngay khi trang vừa tải xong
  hienThiDanhSach();
</script>

</body>
</html>
